name = "accounting-suite"
compatibility_date = "2026-08-23"
pages_build_output_dir = "dist"

# Supabase URL/publishable key are VITE_-prefixed and get baked into the
# client bundle at build time (see src/config/env.ts) -- set them as
# Cloudflare Pages *build* environment variables in the dashboard
# (Settings -> Environment variables), not as Wrangler [vars] here, since
# [vars] only reaches the Pages Functions runtime, not the Vite build step.
# Build command: npm run build (tsc --noEmit && vite build)
# Build output directory: dist
